name: Build AVX NFC Probe

on:
  workflow_dispatch:
  push:
    branches: [ avx-nfc-probe ]
    paths:
      - 'avx-nfc-probe/**'
      - '.github/workflows/avx-nfc-probe.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avx-nfc-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: avx-nfc-probe-debug-apk
          path: avx-nfc-probe/app/build/outputs/apk/debug/app-debug.apk
