plugins {
    id 'com.android.application'
}

android {
    namespace 'com.avx.nfcprobe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.avx.nfcprobe'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
